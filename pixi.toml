[workspace]
name = "spatial-analysis-framework-hnscc"
authors = [
    "Farnoosh Abbas Aghababazadeh <farnoosh.abbasaghababazadeh@uhn.ca>, Gregoire Marret <gregoire.marret@uhn.ca>, Jinsu An <jinsu.an@ucalgary.ca>"
]
description = "This repository contains computational workflows for analyzing spatial transcriptomics data from recurrent/metastatic head and neck squamous cell carcinoma (RM-HNSCC). The analyses characterize spatial tumor–immune–stromal organization, infer cell–cell communication, and derive spatially informed gene expression signatures that predict response to immune checkpoint blockade across cancer types."
license = "MIT"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "win-64", "osx-64"]

[environments]
quality = { features = ["quality"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[activation]
# convenient variables which can be used in scripts
env.CONFIG = "${PIXI_PROJECT_ROOT}/config"
env.METADATA = "${PIXI_PROJECT_ROOT}/metadata"
env.LOGS = "${PIXI_PROJECT_ROOT}/logs"
env.RAWDATA = "${PIXI_PROJECT_ROOT}/data/rawdata"
env.PROCDATA = "${PIXI_PROJECT_ROOT}/data/procdata"
env.RESULTS = "${PIXI_PROJECT_ROOT}/data/results"
env.SCRIPTS = "${PIXI_PROJECT_ROOT}/workflow/scripts"

# ============================================================
# Dependencies
# ============================================================

[dependencies]

# ----------------------
# Python (notebooks / optional)
# ----------------------
python = ">=3.12"
ipython = "*"
ipykernel = "*"
jupyterlab = "*"
pip = "*"

# ----------------------
# R core
# ----------------------
r-base = ">=4.3,<4.4"
r-devtools = "*"
r-remotes = "*"

# ----------------------
# Core CRAN packages
# ----------------------
r-seurat = "*"
r-dplyr = "==1.1.4"
r-tidyr = "==1.3.1"
r-stringr = "*"
r-readr = "*"
r-readxl = "==1.4.5"
r-purrr = "*"
r-tibble = "==3.3.0"
r-ggplot2 = "*"
r-patchwork = "==1.3.2"
r-cowplot = "==1.2.0"
r-pheatmap = "==1.0.13"
r-igraph = "*"
r-forcats = "*"
r-writexl = "*"
r-future = "*"
r-matrix = "*"
r-ape = "==5.8_1"
r-phangorn = "==2.12.1"
r-forestplot = "==3.1.3"
r-meta = "==7.0_0"
r-circlize = "==0.4.16"
r-hmisc = "==5.1_3"
r-rcolorbrewer = "==1.1_3"
r-clustree = "==0.5.1"
r-spdep = "*"

# ----------------------
# Bioconductor packages
# ----------------------

[tasks.postInstall]
cmd = [
  "Rscript -e \"if (!requireNamespace('BiocManager', quietly = TRUE)) install.packages('BiocManager')\"",
  "Rscript -e \"BiocManager::install('GSVA')\"",
  "Rscript -e \"BiocManager::install('MultiAssayExperiment')\"",
  "Rscript -e \"BiocManager::install('survcomp')\"",
  "Rscript -e \"BiocManager::install('singscore')\"",
  "Rscript -e \"BiocManager::install('ComplexHeatmap')\"",
  "Rscript -e \"BiocManager::install('dropletutils')\"",
  "Rscript -e \"BiocManager::install('spatialexperiment')\"",
  "Rscript -e \"BiocManager::install('summarizedexperiment')\"",
  "Rscript -e \"BiocManager::install('scuttle')\"",
  "Rscript -e \"BiocManager::install('infercnv')\"",
  "Rscript -e \"BiocManager::install('aucell')\"",
  "Rscript -e \"BiocManager::install('clusterprofiler')\"",
  "Rscript -e \"BiocManager::install('org.hs.eg.db')\"",
  "Rscript -e \"BiocManager::install('treeio')\"",
  "Rscript -e \"BiocManager::install('ggtree')\"",
  "Rscript -e \"BiocManager::install('nebulosa')\"",
  "Rscript -e \"install.packages('presto')\"",
  "Rscript -e \"remotes::install_github('dmcable/RCTD')\"",
  "Rscript -e \"remotes::install_github('rajewsky-lab/SpotSweeper')\"",
  "Rscript -e \"remotes::install_github('sqjin/CellChat')\"",
  "Rscript -e \"remotes::install_github('SCPubr/SCPubr')\"",
  "Rscript -e \"remotes::install_github('bhklab/PredictioR', ref = '46a2708fc7455a4cd064334b3de2407c7c82db73')\""
]
description = "Install Bioconductor and GitHub R packages"

[pypi-dependencies]
damply = ">=0.10.0, <0.11"


[tasks]
example_script = {cmd="python $SCRIPTS/example_script.py", description="Run an example script"}

############################################## QUALITY ###############################################
# Quality includes linting, type checking, and formatting
[feature.quality.dependencies]
ruff = "*"

[feature.quality.tasks]
ruff-check.cmd = ["ruff", "check"]
ruff-check.inputs = ["config/ruff.toml", "workflow"]
ruff-check.description = "Run ruff check"

ruff-format.cmd = ["ruff", "format"]
ruff-format.inputs = ["config/ruff.toml", "workflow"]
ruff-format.depends-on = ["ruff-check"]
ruff-format.description = "Run ruff format, run check first"

qc.depends-on = ["ruff-format", "ruff-check"]
qc.description = "Quality check: ruff check and format"

############################################## DOCS ################################################

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-include-markdown-plugin = ">=7.0.0,<8"

[feature.docs.tasks.doc-build]
cmd = "mkdocs build -f mkdocs.yaml"
description = "Build documentation with mkdocs"

[feature.docs.tasks.doc-serve]
cmd = "mkdocs serve -f mkdocs.yaml"
depends-on = ["doc-build"]
description = "Serve documentation with mkdocs, runs doc-build first"
