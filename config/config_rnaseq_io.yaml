# config_rnaseq_io.yaml

# =========================
# Directory Settings
# =========================
paths:
  input_dir: "data/procdata"           # Folder containing input .rda file
  output_dir: "data/results"           # Base output directory
  data_dir: "data/results/data"
  score_dir: "data/results/score"
  assoc_dir: "data/results/assoc"
  meta_dir: "data/results/meta"
  cluster_dir: "data/results/cluster"
  fig_dir: "data/results/Fig"

# =========================
# Study & Cohort Metadata
# =========================
study_icb: "ICB_Gide"          # e.g., ICB_Gide
cancer_type: "Melanoma"        # e.g., Melanoma
treatment_type: "PD-(L)1"      # e.g., PD-(L)1, CTLA-4, combo

# =========================
# File & Directory Settings
# =========================
dir_in: "data/procdata"             # Folder containing input .rda file
dir_out: "data/results/data"       # Folder to save all output .rda files

# Object names inside the loaded .rda file
objects:
  expr: "dat$ICB"
  signature: "dat$signature"
  signature_info: "dat$sig.info"

# =========================
# Signature Scoring Settings
# =========================
signature_scoring:
  missing.perc: 0.5       # Max % of missing genes allowed in signature
  const.int: 1        # Constant added to avoid log(0)
  n.cutoff: 15            # Minimum samples required for analysis
  sig.perc: 0.8           # Required % of genes present to compute score

# =========================
# Survival Analysis Settings
# =========================
survival:
  censor_time_months: 24
  min_group_size: 3            # For dichotomization
  predictor_type: "continuous" # continuous or dichotomized

# =========================
# Logistic Regression Settings
# =========================
logreg:
  n0.cutoff: 3            # Minimum number of non-responders
  n1.cutoff: 3            # Minimum number of responders

# =========================
# Output File Name Suffixes
# (Filenames will be prepended with study + cancer + treatment)
# =========================
output_files:
  scores: "score/<study><cancer_type><treatment>.rda"
  correlation: "cor/<study><cancer_type><treatment>.rda"
  survival_pfs (cont): "assoc/sig_pfs.rda"
  survival_pfs (cont): "assoc/sig_pfs_dicho.rda"
  logreg_response: "assoc/sig_logreg.rda"
  meta_results: "meta/meta_all.csv"
  cluster: "cluster/clusters_IO_genes.csv"
  
# =========================
# Software Environment
# =========================
environment:
  r_version: "4.3.1"
  use_renv: true
  renv_lockfile: "renv.lock"